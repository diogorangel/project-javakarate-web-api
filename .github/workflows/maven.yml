name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Run Tests
      # A flag -Dpolyglotimpl.DisableVersionChecks=true é essencial para contornar 
      # conflitos de versão do GraalVM que você enfrentou anteriormente
      run: >
        mvn test 
        -DargLine="-Dpolyglotimpl.DisableVersionChecks=true"
        --file pom.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports